<mat-card *ngIf="pvcAppStore.workingDirectory() == '' else showStatsMenu">
  <mat-card-header>
    <mat-card-title>Video Files</mat-card-title>
  </mat-card-header>
  <mat-card-content>
   <pvc-file-browser (workingDirectoryChange)="checkNewWorkingDirectory()"></pvc-file-browser>
  </mat-card-content>
</mat-card>

<ng-template #showStatsMenu>
  <mat-card>
    <mat-card-header>
      <mat-card-title>Working Directory Stats</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div style="display: flex; flex-direction: row; justify-content: space-around">
            <pvc-stats></pvc-stats>
            <button mat-flat-button (click)="resetWorkspace()">Change Workspace</button>
        </div>
    </mat-card-content>
  </mat-card>
  <div style="display: flex; flex-direction: row; justify-content: space-around">
    <pvc-gauge></pvc-gauge>
    <pvc-video-list title="H.264 Videos" description="Convert these videos to reduce space"
                    [videoTable]="pvcAppStore.h264VideoTable()" [showEnqueue]="true"></pvc-video-list>

  </div>

  <pvc-video-list title="Conversion Queue" description="Videos queued for conversion"
                  [videoTable]="" [showEnqueue]="false"></pvc-video-list>
</ng-template>
